<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Askar.Net - Portal Sistem Manajemen ISP Terpadu</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js for Financial Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: 280px;
            max-height: 320px;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-report, #printable-report * {
                visibility: visible;
            }
            #printable-report {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                color: black !important;
                padding: 20px;
                margin: 0;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex items-center justify-center">

    <div id="app" class="w-full h-screen flex flex-col">
        <!-- Dynamic JavaScript Content -->
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Berhasil</span>
    </div>

    <!-- Hidden File Input for CSV Import -->
    <input type="file" id="csv-import-input" accept=".csv, .json" class="hidden" onchange="processImportedFile(event)">

    <script>
        const STORAGE_KEY = 'askar_net_clean_db_v8';
        
        let db = {
            customers: [],
            packages: [
                { id: 'pkg-1', name: 'Hemat', speed: '5 Mbps', price: 100000 },
                { id: 'pkg-2', name: 'Reguler', speed: '7 Mbps', price: 125000 },
                { id: 'pkg-3', name: 'Standar', speed: '10 Mbps', price: 150000 },
                { id: 'pkg-4', name: 'Medium', speed: '15 Mbps', price: 200000 },
                { id: 'pkg-5', name: 'Fast', speed: '20 Mbps', price: 250000 },
                { id: 'pkg-6', name: 'Giga Enterprise', speed: '50 Mbps', price: 500000 }
            ],
            bills: [],
            transactions: [],
            company: {
                name: 'Askar.Net',
                tagline: 'Portal Sistem Manajemen ISP Terpadu',
                phone: '081234567890',
                address: 'Jl. Raya Cilakar No. 12, Jawa Barat',
                activeDatabase: 'Database Aktif | September 2026'
            }
        };

        function loadDatabase() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    db = { ...db, ...parsed };
                } catch (e) {
                    console.error('Gagal memuat database dari LocalStorage', e);
                }
            }
        }

        function saveDatabase() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        loadDatabase();

        let currentView = 'login'; // 'login', 'dashboard', 'customer_portal'
        let currentRole = null; // 'admin', 'employee'
        let activeCustomer = null;
        let activeMenu = 'dashboard';
        let activeChart = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');

            msg.textContent = message;
            if (type === 'success') {
                icon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            } else if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-lg';
            } else {
                icon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobile-sidebar');
            if (sidebar) {
                sidebar.classList.toggle('-translate-x-full');
            }
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentView === 'login') {
                app.innerHTML = renderLoginView();
            } else if (currentView === 'dashboard') {
                app.innerHTML = renderDashboardLayout();
                initViewScripts();
            } else if (currentView === 'customer_portal') {
                app.innerHTML = renderCustomerPortalView();
            }
        }

        function initViewScripts() {
            if (activeMenu === 'finance') {
                setTimeout(renderFinanceChart, 50);
            }
        }

        function renderLoginView() {
            const customerOptions = db.customers.length > 0 
                ? db.customers.map(c => `<option value="${c.id}">${c.name} (${c.phone || 'No Telp'})</option>`).join('')
                : `<option value="">-- Belum ada pelanggan terdaftar --</option>`;

            return `
                <div class="w-full h-full flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-indigo-950 via-slate-900 to-blue-950 overflow-y-auto">
                    <div class="bg-white w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row my-auto">
                        <div class="bg-blue-600 md:w-5/12 p-8 sm:p-10 flex flex-col justify-between text-white relative overflow-hidden">
                            <div class="absolute -right-10 -bottom-10 opacity-10 pointer-events-none">
                                <i class="fa-solid fa-wifi text-[280px]"></i>
                            </div>
                            <div>
                                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-md mb-6 shadow-inner">
                                    <i class="fa-solid fa-wifi text-white text-xl"></i>
                                </div>
                                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">${db.company.name}</h1>
                                <p class="text-blue-100 text-sm leading-relaxed">${db.company.tagline}</p>
                            </div>
                            <div class="text-xs text-blue-200 pt-6">
                                © 2026 ${db.company.name}.<br>All rights reserved.
                            </div>
                        </div>

                        <div class="md:w-7/12 p-6 sm:p-10 md:p-12 flex flex-col justify-between bg-white">
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-1">Selamat Datang</h2>
                                <p class="text-xs sm:text-sm text-slate-500 mb-6 sm:mb-8">Silakan pilih hak akses untuk masuk ke sistem.</p>

                                <div class="space-y-4">
                                    <div onclick="loginAs('admin')" class="group border border-slate-200 hover:border-blue-500 rounded-2xl p-4 cursor-pointer transition-all duration-200 flex items-center gap-4 hover:shadow-md bg-slate-50/50 hover:bg-blue-50/30">
                                        <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors shrink-0">
                                            <i class="fa-solid fa-shield-halved text-lg"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-sm sm:text-base">Masuk sebagai Admin</h3>
                                            <p class="text-xs text-slate-500">Akses penuh ke semua fitur dan keuangan</p>
                                        </div>
                                    </div>

                                    <div onclick="loginAs('employee')" class="group border border-slate-200 hover:border-blue-500 rounded-2xl p-4 cursor-pointer transition-all duration-200 flex items-center gap-4 hover:shadow-md bg-slate-50/50 hover:bg-blue-50/30">
                                        <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center group-hover:bg-amber-600 group-hover:text-white transition-colors shrink-0">
                                            <i class="fa-solid fa-user-tie text-lg"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-sm sm:text-base">Masuk sebagai Karyawan</h3>
                                            <p class="text-xs text-slate-500">Akses pengelolaan pelanggan & tagihan</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-8 pt-6 border-t border-slate-100">
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">AREA PELANGGAN</label>
                                <div class="flex flex-col sm:flex-row gap-3">
                                    <select id="customer-select" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:border-blue-500">
                                        ${customerOptions}
                                    </select>
                                    <button onclick="handleCustomerCheck()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-6 py-3 rounded-xl text-sm transition-colors shadow-sm flex items-center justify-center gap-2">
                                        Cek Tagihan
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function loginAs(role) {
            currentRole = role;
            currentView = 'dashboard';
            activeMenu = 'dashboard';
            showToast(`Masuk sebagai ${role === 'admin' ? 'Admin ISP' : 'Karyawan'}`, 'success');
            render();
        }

        function handleCustomerCheck() {
            const select = document.getElementById('customer-select');
            const custId = select.value;
            if (!custId) {
                showToast('Belum ada data pelanggan.', 'error');
                return;
            }
            activeCustomer = db.customers.find(c => c.id === custId);
            currentView = 'customer_portal';
            render();
        }

        function renderDashboardLayout() {
            const roleTitle = currentRole === 'admin' ? 'Admin ISP' : 'Karyawan';
            const roleBadge = currentRole === 'admin' ? 'Admin' : 'Staff';

            const sidebarContent = `
                <div class="flex flex-col h-full justify-between bg-white border-r border-slate-200 w-64">
                    <div>
                        <div class="p-6 flex items-center justify-between border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-sm">
                                    <i class="fa-solid fa-wifi text-sm"></i>
                                </div>
                                <span class="font-bold text-lg text-slate-900">${db.company.name}</span>
                            </div>
                            <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <div class="p-4 space-y-1">
                            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-3 pb-2">MENU UTAMA</div>
                            
                            <a onclick="switchMenu('dashboard'); toggleMobileSidebar();" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-colors ${activeMenu === 'dashboard' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                                <i class="fa-solid fa-border-all w-5 text-center"></i> Dashboard
                            </a>
                            <a onclick="switchMenu('customers'); toggleMobileSidebar();" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-colors ${activeMenu === 'customers' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                                <i class="fa-solid fa-users w-5 text-center"></i> Pelanggan
                            </a>
                            <a onclick="switchMenu('billing'); toggleMobileSidebar();" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-colors ${activeMenu === 'billing' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                                <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Tagihan
                            </a>
                            <a onclick="switchMenu('finance'); toggleMobileSidebar();" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-colors ${activeMenu === 'finance' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                                <i class="fa-solid fa-wallet w-5 text-center"></i> Keuangan
                            </a>
                            <a onclick="switchMenu('packages'); toggleMobileSidebar();" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-colors ${activeMenu === 'packages' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                                <i class="fa-solid fa-network-wired w-5 text-center"></i> Paket Layanan
                            </a>
                            ${currentRole === 'admin' ? `
                            <a onclick="switchMenu('company'); toggleMobileSidebar();" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-colors ${activeMenu === 'company' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}">
                                <i class="fa-solid fa-building w-5 text-center"></i> Profil Perusahaan
                            </a>` : ''}
                        </div>
                    </div>

                    <div class="p-4 border-t border-slate-100 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-50 border border-blue-100 text-blue-600 flex items-center justify-center font-bold">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <div>
                                <div class="text-sm font-bold text-slate-800">${roleTitle}</div>
                                <div class="text-xs text-slate-400 capitalize">${roleBadge}</div>
                            </div>
                        </div>
                        <button onclick="logout()" class="text-slate-400 hover:text-rose-600 transition-colors p-2" title="Keluar">
                            <i class="fa-solid fa-right-from-bracket text-base"></i>
                        </button>
                    </div>
                </div>
            `;

            return `
                <div class="flex h-screen bg-slate-100 overflow-hidden relative">
                    <aside class="hidden md:flex shrink-0">
                        ${sidebarContent}
                    </aside>

                    <div id="mobile-sidebar" class="fixed inset-y-0 left-0 z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex shadow-2xl">
                        ${sidebarContent}
                    </div>

                    <div class="flex-1 flex flex-col h-screen overflow-hidden">
                        <header class="bg-white border-b border-slate-200 h-16 px-6 sm:px-8 flex items-center justify-between shrink-0">
                            <div class="flex items-center gap-4">
                                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-600 text-xl">
                                    <i class="fa-solid fa-bars"></i>
                                </button>
                                <h2 class="text-base sm:text-lg font-bold text-slate-800 capitalize">${activeMenu === 'dashboard' ? 'Dashboard' : activeMenu === 'customers' ? 'Customers' : activeMenu === 'billing' ? 'Billing' : activeMenu === 'finance' ? 'Finance' : activeMenu === 'packages' ? 'Paket Layanan' : 'Profil Perusahaan'}</h2>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="bg-blue-50 text-blue-700 border border-blue-100 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
                                    <i class="fa-solid fa-database text-[10px]"></i>
                                    <span class="hidden sm:inline">${db.company.activeDatabase}</span>
                                    <span class="sm:hidden">Database</span>
                                </div>
                            </div>
                        </header>

                        <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8">
                            ${renderActiveMenuContent()}
                        </main>
                    </div>
                </div>
            `;
        }

        function switchMenu(menu) {
            activeMenu = menu;
            render();
        }

        function logout() {
            currentRole = null;
            currentView = 'login';
            showToast('Berhasil keluar sistem', 'success');
            render();
        }

        function renderActiveMenuContent() {
            if (activeMenu === 'dashboard') return renderDashboardHome();
            if (activeMenu === 'customers') return renderCustomersView();
            if (activeMenu === 'billing') return renderBillingView();
            if (activeMenu === 'finance') return renderFinanceView();
            if (activeMenu === 'packages') return renderPackagesView();
            if (activeMenu === 'company') return renderCompanyView();
        }

        function renderDashboardHome() {
            const totalCustomers = db.customers.length;
            const pendingBillsCount = db.bills.filter(b => b.status === 'Belum Lunas').length;
            const totalIncomes = db.transactions.filter(t => t.type === 'Masuk').reduce((acc, curr) => acc + curr.amount, 0);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total Pelanggan</p>
                                <h3 class="text-xl sm:text-2xl font-bold text-slate-800">${totalCustomers} Pelanggan</h3>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-users"></i>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Tagihan Tertunda</p>
                                <h3 class="text-xl sm:text-2xl font-bold ${pendingBillsCount > 0 ? 'text-amber-600' : 'text-slate-800'}">${pendingBillsCount} Tagihan</h3>
                            </div>
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-clock"></i>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between sm:col-span-2 md:col-span-1">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pemasukan Bulan Ini</p>
                                <h3 class="text-xl sm:text-2xl font-bold text-emerald-600">Rp ${totalIncomes.toLocaleString('id-ID')}</h3>
                            </div>
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                            <h3 class="text-lg font-bold mb-1">Tindakan Cepat</h3>
                            <p class="text-blue-100 text-sm">Kelola pelanggan baru atau buat tagihan bulanan dengan cepat.</p>
                        </div>
                        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                            <button onclick="switchMenu('customers'); openCustomerModal();" class="w-full sm:w-auto bg-white/10 hover:bg-white/20 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition-colors border border-white/20 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-user-plus"></i> Tambah Pelanggan
                            </button>
                            <button onclick="switchMenu('billing')" class="w-full sm:w-auto bg-white text-blue-700 hover:bg-blue-50 font-medium px-5 py-2.5 rounded-xl text-sm transition-colors shadow-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-file-invoice"></i> Cek Tagihan
                            </button>
                        </div>
                    </div>

                    ${totalCustomers === 0 ? `
                        <div class="bg-white rounded-2xl p-8 border border-dashed border-slate-300 text-center space-y-3">
                            <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                                <i class="fa-solid fa-database"></i>
                            </div>
                            <h4 class="text-base font-bold text-slate-800">Database Kosong & Siap Digunakan</h4>
                            <p class="text-slate-500 text-sm max-w-md mx-auto">Sistem saat ini bersih dari data sampel. Mulailah dengan menginput data pelanggan baru.</p>
                            <div class="pt-2 flex flex-col sm:flex-row justify-center gap-3">
                                <button onclick="switchMenu('customers'); openCustomerModal();" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-xl text-sm shadow-sm">
                                    + Tambah Pelanggan Pertama
                                </button>
                                <button onclick="triggerImportCSV()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-5 py-2 rounded-xl text-sm border border-slate-200">
                                    <i class="fa-solid fa-file-import mr-1"></i> Import CSV
                                </button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderCustomersView() {
            const rows = db.customers.length === 0 ? `
                <tr>
                    <td colspan="5" class="text-center py-16 text-slate-400 text-sm">
                        <i class="fa-solid fa-folder-open text-3xl mb-3 block text-slate-300"></i>
                        Belum ada data pelanggan.<br>Silakan klik <b>+ Pelanggan Baru</b> atau <b>Import</b>.
                    </td>
                </tr>
            ` : db.customers.map(c => `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="py-4 px-4 sm:px-6">
                        <div class="font-bold text-slate-800 text-sm">${c.name}</div>
                        <div class="text-xs text-slate-400">${c.phone || '-'}</div>
                        <div class="text-xs text-amber-600 font-medium mt-0.5">Jatuh Tempo: Tgl ${c.dueDate || '10'}</div>
                    </td>
                    <td class="py-4 px-4 sm:px-6">
                        <div class="text-slate-700 text-xs sm:text-sm">${c.address || '-'}</div>
                        <div class="text-xs text-slate-400">${c.rtRw || '-'}</div>
                    </td>
                    <td class="py-4 px-4 sm:px-6">
                        <span class="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap">${c.package}</span>
                    </td>
                    <td class="py-4 px-4 sm:px-6">
                        <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-semibold">${c.status}</span>
                    </td>
                    <td class="py-4 px-4 sm:px-6 text-right space-x-1">
                        <button onclick="editCustomer('${c.id}')" class="text-slate-400 hover:text-blue-600 p-2 transition-colors" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteCustomer('${c.id}')" class="text-slate-400 hover:text-rose-600 p-2 transition-colors" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-1">Data Pelanggan</h2>

        function openCustomerModal(id = null) {
            const modal = document.getElementById('customer-modal');
            const title = document.getElementById('modal-title');
            document.getElementById('customer-form').reset();
            document.getElementById('cust-id').value = '';

            if (id) {
                title.textContent = 'Edit Data Pelanggan';
                const c = db.customers.find(item => item.id === id);
                if (c) {
                    document.getElementById('cust-id').value = c.id;
                    document.getElementById('cust-name').value = c.name;
                    document.getElementById('cust-phone').value = c.phone;
                    document.getElementById('cust-due').value = c.dueDate;
                    document.getElementById('cust-address').value = c.address;
                    document.getElementById('cust-rtrw').value = c.rtRw;
                    document.getElementById('cust-package').value = c.package;
                    document.getElementById('cust-status').value = c.status;
                }
            } else {
                title.textContent = 'Tambah Pelanggan Baru';
            }
            modal.classList.remove('hidden');
        }

        function closeCustomerModal() {
            document.getElementById('customer-modal').classList.add('hidden');
        }

        function saveCustomer(e) {
            e.preventDefault();
            const id = document.getElementById('cust-id').value;
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const dueDate = document.getElementById('cust-due').value;
            const address = document.getElementById('cust-address').value;
            const rtRw = document.getElementById('cust-rtrw').value;
            const packageVal = document.getElementById('cust-package').value;
            const status = document.getElementById('cust-status').value;

            if (id) {
                const index = db.customers.findIndex(c => c.id === id);
                if (index !== -1) {
                    db.customers[index] = { ...db.customers[index], name, phone, dueDate, address, rtRw, package: packageVal, status };
                }
                showToast('Data pelanggan berhasil diperbarui', 'success');
            } else {
                const newCust = {
                    id: 'cust-' + Date.now(),
                    name, phone, dueDate, address, rtRw, package: packageVal, status
                };
                db.customers.push(newCust);
                
                const selectedPkg = db.packages.find(p => `${p.name} (${p.speed})` === packageVal);
                const price = selectedPkg ? selectedPkg.price : 100000;

                db.bills.push({
                    id: 'bill-' + Date.now(),
                    customerId: newCust.id,
                    customerName: name,
                    period: 'September 2026',
                    amount: price,
                    status: 'Belum Lunas'
                });

                showToast('Pelanggan baru & tagihan awal berhasil dibuat', 'success');
            }

            saveDatabase();
            closeCustomerModal();
            render();
        }

        function editCustomer(id) {
            openCustomerModal(id);
        }

        function deleteCustomer(id) {
            if (confirm('Apakah Anda yakin ingin menghapus pelanggan ini?')) {
                db.customers = db.customers.filter(c => c.id !== id);
                db.bills = db.bills.filter(b => b.customerId !== id);
                saveDatabase();
                showToast('Pelanggan berhasil dihapus', 'success');
                render();
            }
        }

        function filterCustomers(query) {
            const tbody = document.getElementById('customer-table-body');
            const filtered = db.customers.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.phone.includes(query));
            
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400 text-sm">Tidak ditemukan pelanggan yang cocok.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(c => `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="py-4 px-6">
                        <div class="font-bold text-slate-800">${c.name}</div>
                        <div class="text-xs text-slate-400">${c.phone || '-'}</div>
                        <div class="text-xs text-amber-600 font-medium mt-0.5">Jatuh Tempo: Tgl ${c.dueDate || '10'}</div>
                    </td>
                    <td class="py-4 px-6">
                        <div class="text-slate-700 text-sm">${c.address || '-'}</div>
                        <div class="text-xs text-slate-400">${c.rtRw || '-'}</div>
                    </td>
                    <td class="py-4 px-6">
                        <span class="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full text-xs font-semibold">${c.package}</span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-semibold">${c.status}</span>
                    </td>
                    <td class="py-4 px-6 text-right space-x-1">
                        <button onclick="editCustomer('${c.id}')" class="text-slate-400 hover:text-blue-600 p-2 transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteCustomer('${c.id}')" class="text-slate-400 hover:text-rose-600 p-2 transition-colors"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function triggerImportCSV() {
            document.getElementById('csv-import-input').click();
        }

        function processImportedFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    if (file.name.endsWith('.json')) {
                        const imported = JSON.parse(content);
                        if (Array.isArray(imported)) {
                            db.customers.push(...imported);
                        }
                    } else {
                        const lines = content.split('\n');
                        lines.forEach((line, index) => {
                            if (index === 0 || !line.trim()) return;
                            const [name, phone, dueDate, address, rtRw, pkgName, status] = line.split(',').map(s => s?.trim());
                            if (name) {
                                db.customers.push({
                                    id: 'cust-' + Date.now() + index,
                                    name,
                                    phone: phone || '',
                                    dueDate: dueDate || '25',
                                    address: address || '',
                                    rtRw: rtRw || '',
                                    package: pkgName || 'Hemat (5 Mbps)',
                                    status: status || 'Aktif'
                                });
                            }
                        });
                    }
                    saveDatabase();
                    showToast('Data pelanggan berhasil diimport!', 'success');
                    render();
                } catch (err) {
                    showToast('Gagal mengimport file.', 'error');
                }
            };
            reader.readAsText(file);
        }

        function exportCustomersCSV() {
            if (db.customers.length === 0) {
                showToast('Tidak ada data pelanggan untuk diexport.', 'error');
                return;
            }
            let csv = 'Nama,Telepon,JatuhTempo,Alamat,RTRW,Paket,Status\n';
            db.customers.forEach(c => {
                csv += `"${c.name}","${c.phone}","${c.dueDate}","${c.address}","${c.rtRw}","${c.package}","${c.status}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Data_Pelanggan_${db.company.name}_2026.csv`);
            a.click();
            showToast('File CSV berhasil diunduh', 'success');
        }

                                <input type="date" id="bill-calendar-input" value="2026-09-01" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 focus:outline-none shadow-sm cursor-pointer">

        function printReceipt(billId) {
            const bill = db.bills.find(b => b.id === billId);
            if (!bill) return;

            document.getElementById('rcpt-id').textContent = 'TRX-' + bill.id.slice(-6);
            document.getElementById('rcpt-date').textContent = new Date().toLocaleDateString('id-ID');
            document.getElementById('rcpt-name').textContent = bill.customerName;
            document.getElementById('rcpt-period').textContent = bill.period;
            document.getElementById('rcpt-amount').textContent = 'Rp ' + bill.amount.toLocaleString('id-ID');

            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeReceiptModal() {
            document.getElementById('receipt-modal').classList.add('hidden');
        }

        function generateMonthlyBills() {
            if (db.customers.length === 0) {
                showToast('Tidak ada pelanggan terdaftar.', 'error');
                return;
            }

            const calendarInput = document.getElementById('bill-calendar-input');
            const selectedDateValue = calendarInput ? calendarInput.value : '2026-09-01';
            
            const dateObj = new Date(selectedDateValue);
            const options = { month: 'long', year: 'numeric' };
            const targetPeriod = !isNaN(dateObj) ? dateObj.toLocaleDateString('id-ID', options) : 'September 2026';

            let createdCount = 0;

            db.customers.forEach(c => {
                const alreadyExists = db.bills.some(b => b.customerId === c.id && b.period === targetPeriod);
                if (!alreadyExists && c.status === 'Aktif') {
                    const pkgObj = db.packages.find(p => `${p.name} (${p.speed})` === c.package) || db.packages[0];
                    db.bills.push({
                        id: 'bill-' + Date.now() + Math.random(),
                        customerId: c.id,
                        customerName: c.name,
                        period: targetPeriod,
                        amount: pkgObj ? pkgObj.price : 100000,
                        status: 'Belum Lunas'
                    });
                    createdCount++;
                }
            });

            saveDatabase();
            if (createdCount > 0) {
                showToast(`Berhasil generate ${createdCount} tagihan periode ${targetPeriod}`, 'success');
            } else {
                showToast(`Semua pelanggan aktif sudah memiliki tagihan periode ${targetPeriod}`, 'info');
            }
            render();
        }

        function payBill(id) {
            const bill = db.bills.find(b => b.id === id);
            if (!bill) return;

            bill.status = 'Lunas';
            
            db.transactions.push({
                id: 'trx-' + Date.now(),
                date: '17 Sep 2026',
                description: `Pembayaran Tagihan - ${bill.customerName} (${bill.period})`,
                type: 'Masuk',
                amount: bill.amount
            });

            saveDatabase();
            showToast(`Tagihan ${bill.customerName} berhasil dilunasi`, 'success');
            render();
        }

        function renderFinanceChart() {
            const ctx = document.getElementById('financeChart')?.getContext('2d');
            if (!ctx) return;

            if (activeChart) activeChart.destroy();

            const totalIncomes = db.transactions.filter(t => t.type === 'Masuk').reduce((acc, curr) => acc + curr.amount, 0);
            const totalExpenses = db.transactions.filter(t => t.type === 'Keluar').reduce((acc, curr) => acc + curr.amount, 0);

            activeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Pemasukan', 'Pengeluaran', 'Saldo Bersih'],
                    datasets: [{
                        label: 'Nominal (Rp)',
                        data: [totalIncomes, totalExpenses, totalIncomes - totalExpenses],
                        backgroundColor: ['#10b981', '#f43f5e', '#2563eb'],
                        borderRadius: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) { return 'Rp ' + value.toLocaleString('id-ID'); }
                            }
                        }
                    }
                }
            });
        }

        function openPackageModal(id = null) {
            const modal = document.getElementById('pkg-modal');

            document.getElementById('pkg-name').value = '';
            document.getElementById('pkg-speed').value = '';
            document.getElementById('pkg-price').value = '';

            if (id) {
                title.textContent = 'Edit Paket Layanan';
                const p = db.packages.find(item => item.id === id);
                if (p) {
                    document.getElementById('pkg-id').value = p.id;
                    document.getElementById('pkg-name').value = p.name;
                    document.getElementById('pkg-speed').value = p.speed;
                    document.getElementById('pkg-price').value = p.price;
                }
            } else {
                title.textContent = 'Tambah Paket Layanan';
            }
            modal.classList.remove('hidden');
        }

            openPackageModal(id);

            document.getElementById('pkg-modal').classList.add('hidden');

            e.preventDefault();
            const id = document.getElementById('pkg-id').value;
            const name = document.getElementById('pkg-name').value;
            const speed = document.getElementById('pkg-speed').value;
            const price = parseFloat(document.getElementById('pkg-price').value);

            if (id) {
                const index = db.packages.findIndex(p => p.id === id);
                if (index !== -1) {
                    db.packages[index] = { ...db.packages[index], name, speed, price };
                }
                showToast('Paket berhasil diperbarui', 'success');
            } else {
                db.packages.push({
                    id: 'pkg-' + Date.now(),
                    name, speed, price
                });
                showToast('Paket baru berhasil ditambahkan', 'success');
            }

            saveDatabase();
            closePackageModal();
            render();
        }

            if (confirm('Hapus paket layanan ini?')) {

        function resetDatabaseWithConfirm() {
            if (confirm('APAKAH ANDA YAKIN? Tindakan ini akan mengosongkan seluruh data pelanggan, tagihan, dan keuangan.')) {
                db.customers = [];
                db.bills = [];
                db.transactions = [];
                saveDatabase();
                showToast('Database berhasil dibersihkan', 'info');
                render();
            }
        }

        function renderCustomerPortalView() {
            if (!activeCustomer) {
                currentView = 'login';
                render();
                return;
            }

            const customerBills = db.bills.filter(b => b.customerId === activeCustomer.id);
            const unpaidBills = customerBills.filter(b => b.status === 'Belum Lunas');
            const totalDebt = unpaidBills.reduce((acc, curr) => acc + curr.amount, 0);

            return `
                <div class="min-h-screen bg-slate-950 text-slate-100 p-4 sm:p-8 md:p-12 flex flex-col items-center">
                    <div class="w-full max-w-4xl space-y-6">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shrink-0">
                                    <i class="fa-solid fa-wifi"></i>
                                </div>
                                <div>
                                    <h1 class="text-base sm:text-xl font-bold">${db.company.name} - Portal Pelanggan</h1>
                                    <p class="text-xs text-slate-400">Selamat datang, ${activeCustomer.name}</p>
                                </div>
                            </div>
                            <button onclick="logoutCustomer()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs sm:text-sm transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-arrow-left"></i> Kembali
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
                                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">INFORMASI AKUN</span>
                                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold">${activeCustomer.status}</span>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-white">${activeCustomer.name}</div>
                                    <div class="text-sm text-slate-400">${activeCustomer.phone || '-'}</div>
                                </div>
                                <div class="grid grid-cols-2 gap-4 pt-2">
                                    <div>
                                        <div class="text-xs text-slate-500">Paket Layanan</div>
                                        <div class="text-sm font-semibold text-blue-400">${activeCustomer.package}</div>
                                    </div>
                                    <div>
                                        <div class="text-xs text-slate-500">Jatuh Tempo</div>
                                        <div class="text-sm font-semibold text-amber-400">Tgl ${activeCustomer.dueDate || '10'}</div>
                                    </div>
                                </div>
                                <div>
                                    <div class="text-xs text-slate-500">Alamat Pemasangan</div>
                                    <div class="text-sm text-slate-300">${activeCustomer.address || '-'} (${activeCustomer.rtRw || '-'})</div>
                                </div>
                            </div>

                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col justify-between shadow-xl">
                                <div>
                                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">TAGIHAN TERTUNDA</div>
                                    <div class="text-3xl sm:text-4xl font-black ${totalDebt > 0 ? 'text-rose-500' : 'text-emerald-400'} mb-1">
                                        Rp ${totalDebt.toLocaleString('id-ID')}
                                    </div>
                                    <p class="text-xs text-slate-400">${totalDebt > 0 ? 'Segera lakukan pembayaran.' : 'Semua tagihan Anda lunas.'}</p>
                                </div>

                                <div class="space-y-2 pt-6">
                                    ${totalDebt > 0 ? `
                                        <button onclick="payCustomerBill('${activeCustomer.id}')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-2xl text-sm transition-colors shadow-lg flex items-center justify-center gap-2">
                                            <i class="fa-solid fa-money-bill-wave"></i> Konfirmasi Bayar Sekarang
                                        </button>
                                    ` : `
                                        <div class="w-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 py-3 rounded-2xl text-sm text-center font-semibold">
                                            <i class="fa-solid fa-circle-check mr-1"></i> Status Aman & Lunas
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                            <h3 class="font-bold text-white text-base mb-4">Riwayat Tagihan Bulanan</h3>
                            <div class="space-y-3">
                                ${customerBills.length === 0 ? '<p class="text-sm text-slate-500">Belum ada riwayat tagihan.</p>' : customerBills.map(b => `
                                    <div class="flex items-center justify-between p-4 bg-slate-950/60 rounded-2xl border border-slate-800/80">
                                        <div>
                                            <div class="font-bold text-white text-sm">Periode ${b.period}</div>
                                            <div class="text-xs text-slate-400">Nominal: Rp ${b.amount.toLocaleString('id-ID')}</div>
                                        </div>
                                        <div>
                                            <span class="${b.status === 'Lunas' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'} px-3 py-1 rounded-full text-xs font-semibold">${b.status}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function payCustomerBill(custId) {
            const unpaid = db.bills.filter(b => b.customerId === custId && b.status === 'Belum Lunas');
            unpaid.forEach(b => {
                b.status = 'Lunas';
                db.transactions.push({
                    id: 'trx-' + Date.now() + Math.random(),
                    date: '17 Sep 2026',
                    description: `Pembayaran Mandiri Pelanggan - ${b.customerName} (${b.period})`,
                    type: 'Masuk',
                    amount: b.amount
                });
            });
            saveDatabase();
            showToast('Pembayaran berhasil dikonfirmasi!', 'success');
            render();
        }

        function logoutCustomer() {
            activeCustomer = null;
            currentView = 'login';
            render();
        }

        render();
    </script>
</body>
</html>
